# SPDX-License-Identifier: MPL-2.0
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3.1.0
      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'
  r-backend:
    name: R backend vs MGLM (renv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: renv
      - uses: r-lib/actions/setup-renv@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.12'   # test/r/Manifest.toml was resolved on 1.12
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3.1.0
      - name: MGLM is the pinned version
        run: Rscript -e 'stopifnot(packageVersion("MGLM") == renv::lockfile_read()$Packages$MGLM$Version)'
      # RCall depends on Conda.jl, whose module init refuses a missing root env dir
      # even when RCall uses the system R installed above; create the empty dir.
      - name: Conda root env dir for RCall
        run: mkdir -p ~/.julia/conda/3/x86_64
      - name: Locate embedded-R exit (temporary)
        continue-on-error: true
        run: |
          set +e
          julia --project=test/r -e 'using Pkg; Pkg.instantiate()' >/dev/null 2>&1
          P=$GITHUB_WORKSPACE/test/r
          echo "== profiles"; ls -la ~/.Rprofile .Rprofile 2>&1; cat ~/.Rprofile 2>&1 | head -20; echo "-- site"; cat /opt/R/4.5.0/lib/R/etc/Rprofile.site 2>&1 | head -20; echo "-- Renviron.site"; cat /opt/R/4.5.0/lib/R/etc/Renviron.site 2>&1 | head
          echo "== v5 base pkg load error"; R_PROFILE_USER=/dev/null julia --project=test/r -e 'using RCall; println(rcopy(R"tryCatch({library(utils); \"utils ok\"}, error=function(e) conditionMessage(e))")); println(rcopy(R"tryCatch({dyn.load(file.path(R.home(\"library\"),\"stats\",\"libs\",\"stats.so\")); \"stats.so ok\"}, error=function(e) conditionMessage(e))")); println(rcopy(R"Sys.getenv(c(\"R_HOME\",\"R_LIBS\",\"R_LIBS_SITE\",\"R_DEFAULT_PACKAGES\"))"))' 2>&1 | grep -v "^\s*@"; echo "v5 rc=${PIPESTATUS[0]}"
          echo "== ldd libR"; ldd /opt/R/4.5.0/lib/R/lib/libR.so | head -20
      - name: Julia MN vs MGLM
        # Serial precompile on first `using`, so an extension failure prints its error.
        env:
          JULIA_PKG_PRECOMPILE_AUTO: 0
        run: |
          julia --project=test/r -e 'using Pkg; Pkg.instantiate()'
          julia --project=test/r test/r/runtests.jl
