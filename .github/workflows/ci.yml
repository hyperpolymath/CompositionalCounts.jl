# SPDX-License-Identifier: MPL-2.0
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3.1.0
      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'
  r-backend:
    name: R backend vs MGLM (renv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: renv
      - uses: r-lib/actions/setup-renv@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1'
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3.1.0
      - name: MGLM is the pinned version
        run: Rscript -e 'stopifnot(packageVersion("MGLM") == renv::lockfile_read()$Packages$MGLM$Version)'
      - name: Diagnose embedded R (temporary)
        continue-on-error: true
        run: |
          julia --project=test/r -e 'using Pkg; Pkg.instantiate(); println("stage1 julia ", VERSION); flush(stdout); using RCall; println("stage2 RCall loaded, R_HOME=", RCall.Rhome); flush(stdout); println(rcopy(R"R.version.string")); println(rcopy(R"paste(.libPaths(), collapse=\" \")")); println(rcopy(R"as.character(packageVersion(\"MGLM\"))"))' && echo "julia rc=0" || echo "julia rc=$?"
          cat ~/.julia/scratchspaces/44cfe95a-1eb2-52ea-b672-e2afdf69b78f/*/build.log || true
      - name: Julia MN vs MGLM
        run: |
          julia --project=test/r -e 'using Pkg; Pkg.instantiate()'
          julia --project=test/r test/r/runtests.jl
