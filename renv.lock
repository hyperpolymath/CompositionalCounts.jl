      "Title": "Multivariate Response Generalized Linear Models",
      "Authors@R": "c( person(\"Yiwen\", \"Zhang\", email = \"zhangyiwen1015@gmail.com\", role = c(\"aut\")), person(\"Hua\", \"Zhou\", email = \"huazhou@ucla.edu\", role = c(\"aut\")), person(\"Juhyun\", \"Kim\", email = \"juhkim111@ucla.edu\", role = c(\"cre\")), person(\"Magdalena\", \"Czapiewska\", role = c(\"ctb\"), comment = c(ORCID = \"0009-0004-3265-1614\")) )",
